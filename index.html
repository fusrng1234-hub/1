    <meta charset="UTF-8">

    <title>精选应用推荐</title>
    <style>
        /* 基础设置与深色背景 */
        :root {
            --bg: #0f1115;
            --card: #1a1d24;
            --text: #ffffff;
            --text-muted: #8b8e96;
            --accent: #3b82f6;
            --btn-play: linear-gradient(135deg, #34a853, #2c8c46);
            --btn-web: linear-gradient(135deg, #007aff, #0062cc);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* 顶部导航与毛玻璃效果 */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 17, 21, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
        .header p { font-size: 14px; color: var(--text-muted); }

        /* 分类横向滚动 */
        .categories {
            display: flex;
            overflow-x: auto;
            padding: 15px 20px;
            gap: 12px;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }
        
        .cat-btn {
            padding: 8px 20px;
            border-radius: 20px;
            background: var(--card);
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            white-space: nowrap;
        }
        .cat-btn.active {
            background: var(--text);
            color: #000;
            border-color: var(--text);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        /* 应用列表网格 */
        .app-grid {
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 华丽的卡片设计 */
        .app-card {
            background: var(--card);
            border-radius: 22px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .app-card:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border-color: rgba(255,255,255,0.1);
        }
        
        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* 卡片内部结构 */
        .app-header { display: flex; align-items: center; gap: 15px; }
        .app-icon {
            width: 60px; height: 60px;
            border-radius: 16px;
            background: linear-gradient(135deg, #ff6b6b, #c0392b);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }
        .app-info { flex: 1; }
        .app-title { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
        .app-desc { font-size: 13px; color: var(--text-muted); line-height: 1.4; }

        /* 精美的按钮组 */
        .btn-group { display: flex; gap: 12px; }
        .btn {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            color: white;
            transition: opacity 0.2s, transform 0.2s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-play { background: var(--btn-play); box-shadow: 0 4px 15px rgba(52, 168, 83, 0.3); }
        .btn-web { background: var(--btn-web); box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3); }

        /* 底部说明 */
        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 12px;
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>

        function renderApps(category = '全部') {
            appGrid.innerHTML = '';
            
            // 过滤数据
            const list = appsData.filter(app => category === '全部' || app.category === category);

            if(list.length === 0) {
                appGrid.innerHTML = '<div style="text-align:center; color:#555; padding:50px 0; font-size:15px;">这里空空如也~</div>';
                return;
            }

            // 渲染卡片
            list.forEach((app, index) => {
                const card = document.createElement('div');
                card.className = 'app-card';
                // 添加个错开动画的延迟
                card.style.animationDelay = `${index * 0.08}s`;
                
                card.innerHTML = `
                    <div class="app-header">
                        <div class="app-icon" style="background: ${app.iconColor}; box-shadow: 0 5px 15px ${app.iconColor}40;">
                            ${app.iconChar}
                        </div>
                        <div class="app-info">
                            <h2 class="app-title">${app.name}</h2>
                            <p class="app-desc">${app.desc}</p>
                        </div>
                    </div>
                    <div class="btn-group">
                        <a href="${app.playUrl}" class="btn btn-play" target="_blank" rel="noopener">Google Play</a>
                        <a href="${app.webUrl}" class="btn btn-web" target="_blank" rel="noopener">官网下载</a>
                    </div>
                `;
                appGrid.appendChild(card);
            });
        }

        // 分类点击事件
        catBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                catBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderApps(btn.dataset.category);
            });
        });

        // 初始化渲染
        renderApps('全部');
