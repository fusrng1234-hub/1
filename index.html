function appIcon(a){
 const fallback=escapeHtml(initials(a.name));
 let iconUrl='';
 try{
  const host=new URL(a.web).hostname;
  iconUrl='https://www.google.com/s2/favicons?domain='+encodeURIComponent(host)+'&sz=128';
 }catch(_){}
 return `<div class="appicon" style="background:${/^#[0-9a-f]{3,8}$/i.test(a.color)?a.color:'#345'}"><span>${fallback}</span>${iconUrl?`<img src="${iconUrl}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`:''}</div>`;
}

function safeUrl(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch(e){return '#'}}
function initials(name){return [...name].slice(0,2).join('').toUpperCase()}
function filtered(){

 return list;
}

function parseCSV(text){
 const rows=[];let row=[],field='',quoted=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"'){quoted=false}else{field+=c}}
  else if(c==='"'){quoted=true}else if(c===','){row.push(field);field=''}
  else if(c==='\n'){row.push(field);rows.push(row);row=[];field=''}else if(c!=='\r'){field+=c}
 }
 if(field.length||row.length){row.push(field);rows.push(row)}return rows;
}
function guessCategory(name,desc){
 const t=(name+' '+desc).toLowerCase();
 // 游戏平台、游戏本体与游戏相关软件优先识别，避免被“工具/开发”关键词抢先归类。
 if(/\b(steam|epic games store|gog galaxy|itch\.io|lutris|heroic games launcher|playnite|prism launcher|roblox|minecraft|osu!|openttd|supertuxkart|luanti|battle for wesnoth|0 a\.d\.)\b/.test(t) || /\b(video game|game launcher|gaming platform|game library|game client|pc game|open.?source game|game emulator)\b/.test(t))return '游戏';
 if(/\b(godot engine|unity engine|unreal engine|game development|game engine)\b/.test(t))return '游戏开发';
 // 截图、屏幕录制工具不属于影音播放器/编辑器。
 if(/\b(screenshot|screen capture|screen recorder|screen recording|flameshot|sharex)\b/.test(t))return '截图与录屏';
 if(/\b(video|audio|music|media|stream|podcast|subtitle|transcod|player|sound|midi|daw|video editor|music player|audio editor)\b/.test(t))return '影音';
 const rules=[
 ['AI 工具',/\b(ai|llm|machine learning|artificial intelligence|agent|chatbot|inference|embedding)\b/],
 ['开发',/\b(code|coding|developer|git|ide|compiler|debug|api|sdk|programming|database|sql|terminal)\b/],
 ['设计',/\b(design|drawing|vector|image editor|photo|illustration|3d|animation|graphics|font)\b/],
 ['文件与备份',/\b(file|files|backup|sync|storage|cloud|drive|sharing|document|pdf)\b/],
 ['效率办公',/\b(note|notes|task|todo|calendar|project management|productivity|office|wiki|knowledge|bookmark)\b/],
 ['网络与服务器',/\b(server|hosting|docker|container|network|dns|proxy|vpn|monitoring|deployment|self-hosted)\b/],
 ['教育学习',/\b(learn|learning|education|course|school|flashcard|study|dictionary)\b/],
 ['商务管理',/\b(crm|erp|invoice|business|commerce|shop|sales|customer|finance|accounting)\b/]
 ];for(const [cat,re] of rules)if(re.test(t))return cat;return '实用工具';
}
async function loadExtraApps(){
 const url='https://raw.githubusercontent.com/i-ayushsingh/oss-tools-dataset/main/data/tools.csv';
 try{
  const res=await fetch(url,{cache:'no-cache'});if(!res.ok)throw new Error('HTTP '+res.status);
  const rows=parseCSV(await res.text());if(rows.length<2)throw new Error('数据为空');
  const heads=rows[0],idx=Object.fromEntries(heads.map((h,i)=>[h,i]));
  const known=new Set(apps.map(a=>a.name.trim().toLowerCase()));let added=0;
  for(const r of rows.slice(1)){
   const get=k=>(r[idx[k]]||'').trim(),name=get('name'),desc=get('description');
   if(!name||!desc||known.has(name.toLowerCase()))continue;
   if(/\b(casino|gambling|sportsbook|betting|prediction market|poker|slot machine)\b/i.test(name+' '+desc))continue;
   const web=get('website_url')||get('github_url');if(!/^https?:\/\//i.test(web))continue;
   apps.push({name,desc:desc.replace(/\s+/g,' ').slice(0,220),cat:guessCategory(name,desc),color:'#405b83',web,pc:get('github_url')||web});
   known.add(name.toLowerCase());added++;
  }
  update();$('resultCount').textContent=`已载入 ${apps.length} 款应用（新增 ${added} 款） · 当前显示 ${Math.min(state.shown,filtered().length)} 款`;
 }catch(err){$('resultCount').textContent=`目前显示 ${apps.length} 款应用；额外目录暂时无法载入，请检查网络后刷新。`;console.warn('额外目录加载失败：',err)}
}
update();
loadExtraApps();
