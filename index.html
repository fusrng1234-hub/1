<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>精选应用推荐</title>
    <style>
        :root {
            --bg: #0f1115;
            --card: #1a1d24;
            --text: #ffffff;
            --text-muted: #8b8e96;
            --btn-play: linear-gradient(135deg, #34a853, #2c8c46);
            --btn-web: linear-gradient(135deg, #007aff, #0062cc);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 50px;
        }
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 17, 21, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
        .header p { font-size: 14px; color: var(--text-muted); }
        
        .categories {
            display: flex;
            overflow-x: auto;
            padding: 15px 20px;
            gap: 12px;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            padding: 8px 20px;
            border-radius: 20px;
            background: var(--card);
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            white-space: nowrap;
        }
        .cat-btn.active {
            background: var(--text);
            color: #000;
            border-color: var(--text);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }
        
        /* 升级后的网格布局 */
        .app-grid {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }
        .app-card {
            background: var(--card);
            border-radius: 22px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .app-card:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border-color: rgba(255,255,255,0.1);
        }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        
        .app-header { display: flex; align-items: center; gap: 15px; }
        .app-icon {
            width: 60px; height: 60px;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: bold;
            overflow: hidden;
            flex-shrink: 0;
        }
        .app-info { flex: 1; }
        .app-title { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
        .app-desc { font-size: 13px; color: var(--text-muted); line-height: 1.4; }
        
        .btn-group { display: flex; gap: 12px; margin-top: auto; }
        .btn {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            color: white;
            transition: opacity 0.2s, transform 0.2s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-play { background: var(--btn-play); box-shadow: 0 4px 15px rgba(52, 168, 83, 0.3); }
        .btn-web { background: var(--btn-web); box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3); }
        .footer { text-align: center; margin-top: 40px; font-size: 12px; color: #555; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="header">
        <h1>探索应用</h1>
        <p>发现属于你的绝佳工具</p>
    </div>

    <div class="categories" id="categories">
        <button class="cat-btn active" data-category="全部">全部</button>
        <button class="cat-btn" data-category="社交">社交</button>
        <button class="cat-btn" data-category="影音">影音</button>
        <button class="cat-btn" data-category="游戏">游戏</button>
        <button class="cat-btn" data-category="工具">工具</button>
    </div>

    <div class="app-grid" id="appGrid"></div>

    <div class="footer">
        本站仅提供官方安全下载链接<br>
        不托管任何安装包，版权归开发者所有
    </div>

    <script>
        // 数据配置区 (保持你之前的数据即可)
        const appsData = [
            { name: "WhatsApp", desc: "简单、可靠、安全的免费即时通讯应用。", category: "社交", playUrl: "https://play.google.com/store/apps/details?id=com.whatsapp", webUrl: "https://www.whatsapp.com/", iconChar: "W", iconColor: "#25D366" },
            { name: "Instagram", desc: "分享你的生活瞬间，探索全球精彩图文。", category: "社交", playUrl: "https://play.google.com/store/apps/details?id=com.instagram.android", webUrl: "https://www.instagram.com/", iconChar: "I", iconColor: "#E1306C" },
            { name: "Facebook", desc: "全球最大的社交网络平台，与朋友保持联系。", category: "社交", playUrl: "https://play.google.com/store/apps/details?id=com.facebook.katana", webUrl: "https://www.facebook.com/", iconChar: "F", iconColor: "#1877F2" },
            { name: "TikTok", desc: "风靡全球的短视频平台，发现无限创意。", category: "社交", playUrl: "https://play.google.com/store/apps/details?id=com.zhiliaoapp.musically", webUrl: "https://www.tiktok.com/", iconChar: "T", iconColor: "#000000" },
            { name: "Telegram", desc: "极速、安全且免费的即时通讯软件。", category: "社交", playUrl: "https://play.google.com/store/apps/details?id=org.telegram.messenger", webUrl: "https://telegram.org/", iconChar: "T", iconColor: "#0088cc" },
            { name: "YouTube", desc: "全球最大的视频分享平台。", category: "影音", playUrl: "https://play.google.com/store/apps/details?id=com.google.android.youtube", webUrl: "https://www.youtube.com/", iconChar: "Y", iconColor: "#FF0000" },
            { name: "Mobile Legends", desc: "东南亚最火的 5v5 MOBA 竞技手游。", category: "游戏", playUrl: "https://play.google.com/store/apps/details?id=com.mobile.legends", webUrl: "https://m.mobilelegends.com/", iconChar: "M", iconColor: "#1A237E" },
            { name: "Grab", desc: "马来西亚最常用的打车、外卖和电子支付神器。", category: "工具", playUrl: "https://play.google.com/store/apps/details?id=com.grabtaxi.passenger", webUrl: "https://www.grab.com/my/", iconChar: "G", iconColor: "#00B14F" }
            // ... 你的其他应用代码
        ];

        const appGrid = document.getElementById('appGrid');
        const catBtns = document.querySelectorAll('.cat-btn');

        function renderApps(category) {
            if (!category) category = '全部';
            appGrid.innerHTML = '';
            const list = appsData.filter(app => category === '全部' || app.category === category);

            if(list.length === 0) {
                appGrid.innerHTML = '<div style="text-align:center; color:#555; padding:50px 0; font-size:15px; grid-column: 1/-1;">这里空空如也~</div>';
                return;
            }

            list.forEach((app, index) => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.style.animationDelay = (index * 0.05) + 's';
                
                let iconHTML = app.iconChar;
                if(app.iconUrl) {
                    iconHTML = '<img src="' + app.iconUrl + '" style="width: 100%; height: 100%; object-fit: cover;">';
                }
                
                let iconStyle = '';
                if(!app.iconUrl) {
                    iconStyle = 'background: ' + app.iconColor + '; box-shadow: 0 5px 15px ' + app.iconColor + '40;';
                }

                card.innerHTML = 
                    '<div class="app-header">' +
                        '<div class="app-icon" style="' + iconStyle + '">' + iconHTML + '</div>' +
                        '<div class="app-info">' +
                            '<h2 class="app-title">' + app.name + '</h2>' +
                            '<p class="app-desc">' + app.desc + '</p>' +
                        '</div>' +
                    '</div>' +
                    '<div class="btn-group">' +
                        '<a href="' + app.playUrl + '" class="btn btn-play" target="_blank" rel="noopener">Google Play</a>' +
                        '<a href="' + app.webUrl + '" class="btn btn-web" target="_blank" rel="noopener">官网下载</a>' +
                    '</div>';
                appGrid.appendChild(card);
            });
        }

        catBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                catBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderApps(btn.getAttribute('data-category'));
            });
        });

        renderApps('全部');
    </script>
</body>
</html>
