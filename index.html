<div class="footer">
        本站不托管任何 APK 文件，所有下载均跳转至官方渠道。<br>
        应用版权归各自开发者所有。
    </div>

    <script>
        // ==========================================
        // 🚀 在这里添加或修改你的应用数据
        // category (分类) 必须和上面的按钮文字一致
        // ==========================================
        const appsData = [
            {
                name: "微信",
                desc: "腾讯官方出品的通讯软件。",
                category: "社交",
                playUrl: "https://play.google.com/store/apps/details?id=com.tencent.mm",
                webUrl: "https://weixin.qq.com/"
            },
            {
                name: "Telegram",
                desc: "极速、安全的即时通讯软件。",
                category: "社交",
                playUrl: "https://play.google.com/store/apps/details?id=org.telegram.messenger",
                webUrl: "https://telegram.org/"
            },
            {
                name: "哔哩哔哩",
                desc: "年轻人聚集的文化社区。",
                category: "工具",
                playUrl: "https://play.google.com/store/apps/details?id=tv.danmaku.bili",
                webUrl: "https://app.bilibili.com/"
            },
            {
                name: "原神",
                desc: "开放世界冒险游戏。",
                category: "游戏",
                playUrl: "https://play.google.com/store/apps/details?id=com.miHoYo.GenshinImpact",
                webUrl: "https://ys.mihoyo.com/"
            }
        ];

        const appList = document.getElementById('appList');
        const categoryBtns = document.querySelectorAll('.category-btn');

        // 渲染应用列表的函数
        function renderApps(category = 'all') {
            appList.innerHTML = ''; // 清空当前列表

            // 过滤出对应的分类
            const filteredApps = appsData.filter(app => 
                category === 'all' || app.category === category
            );

            if (filteredApps.length === 0) {
                appList.innerHTML = '<p style="text-align:center;color:#999;margin-top:20px;">该分类下暂时没有应用哦~</p>';
                return;
            }

            // 生成卡片
            filteredApps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = 
                    <h2 class="app-title">${app.name}</h2>
                    <p class="app-desc">${app.desc}</p>
                    <div class="btn-group">
                        <a href="${app.playUrl}" class="btn btn-play" target="_blank" rel="noopener">Google Play</a>
                        <a href="${app.webUrl}" class="btn btn-web" target="_blank" rel="noopener">官网下载</a>
                    </div>
                ;
                appList.appendChild(card);
            });
        }

        // 监听分类按钮点击事件
        categoryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // 切换按钮高亮
                categoryBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // 根据分类渲染应用
                const category = btn.getAttribute('data-category');
                renderApps(category);
            });
        });

        // 页面加载时，初始化渲染全部应用
        renderApps('all');
    </script>
</body>
</html>
