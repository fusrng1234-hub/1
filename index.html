<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用推荐下载</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f5f5f7; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #1d1d1f; font-size: 24px; margin-bottom: 20px; }
        .app-card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .app-title { font-size: 18px; font-weight: bold; margin: 0 0 5px 0; color: #1d1d1f; }
        .app-desc { font-size: 14px; color: #86868b; margin: 0 0 15px 0; }
        
        /* 按钮并排显示的布局 */
        .btn-group { display: flex; gap: 10px; }
        
        /* 通用按钮样式 */
        .btn { flex: 1; display: block; text-align: center; padding: 12px 0; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 15px; }
        
        /* Google Play 按钮（绿色） */
        .btn-play { background-color: #34a853; color: white; }
        
        /* 官网下载按钮（蓝色） */
        .btn-web { background-color: #007aff; color: white; }
        
        .footer { text-align: center; font-size: 12px; color: #86868b; margin-top: 30px; padding-bottom: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>精选应用推荐</h1>

        <!-- ================= 应用 1 ================= -->
        <div class="app-card">
            <h2 class="app-title">微信</h2>
            <p class="app-desc">腾讯官方出品的通讯软件。</p>
            
            <div class="btn-group">
                <!-- Google Play 链接：改 id= 后面的包名 -->
                <a href="https://play.google.com/store/apps/details?id=com.tencent.mm" class="btn btn-play" target="_blank" rel="noopener">Google Play</a>
                
                <!-- 官网链接：改成应用的官方网站下载页 -->
                <a href="https://weixin.qq.com/" class="btn btn-web" target="_blank" rel="noopener">官网下载</a>
            </div>
        </div>

        <!-- ================= 应用 2 ================= -->
        <div class="app-card">
            <h2 class="app-title">Telegram</h2>
            <p class="app-desc">极速、安全的即时通讯软件。</p>
            
            <div class="btn-group">
                <a href="https://play.google.com/store/apps/details?id=org.telegram.messenger" class="btn btn-play" target="_blank" rel="noopener">Google Play</a>
                <a href="https://telegram.org/" class="btn btn-web" target="_blank" rel="noopener">官网下载</a>
            </div>
        </div>

        <!-- 如果想加第三个应用，就把上面 <div class="app-card"> 到 </div> 的整段代码复制一遍，改里面的名字和链接 -->

        <div class="footer">
            本站不托管 APK 文件，仅供官方下载链接导航。<br>
            应用版权归各自开发者所有。
        </div>
    </div>
</body>
</html>
