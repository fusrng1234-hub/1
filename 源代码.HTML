<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>探索应用 - 极客应用库</title>
    <style>
        :root {
            --bg: #0f1115;
            --card: #1a1d24;
            --text: #ffffff;
            --text-muted: #8b8e96;
            --btn-play: linear-gradient(135deg, #34a853, #2c8c46);
            --btn-web: linear-gradient(135deg, #007aff, #0062cc);
            --btn-pc: linear-gradient(135deg, #9c27b0, #673ab7);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 50px;
        }
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 17, 21, 0.85);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .header-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; }
        .header h1 { font-size: 26px; font-weight: 800; }
        .header p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
        
        /* 搜索框 */
        .search-box {
            width: 100%;
            padding: 12px 20px;
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        .search-box:focus { background: rgba(255,255,255,0.12); border-color: #007aff; }
        .search-box::placeholder { color: #666; }

        /* 顶部分类栏 */
        .categories {
            display: flex;
            overflow-x: auto;
            padding: 15px 20px;
            gap: 12px;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            padding: 8px 20px;
            border-radius: 20px;
            background: var(--card);
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            white-space: nowrap;
        }
        .cat-btn.active { background: var(--text); color: #000; border-color: var(--text); }
        
        /* 电脑端网格 */
        .app-grid {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }
        .app-card {
            background: var(--card);
            border-radius: 22px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: slideUp 0.4s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .app-card:hover { transform: translateY(-5px) scale(1.01); box-shadow: 0 15px 35px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.1); }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        
        .app-header { display: flex; align-items: center; gap: 15px; }
        .app-icon {
            width: 60px; height: 60px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: bold; overflow: hidden; flex-shrink: 0;
        }
        .app-info { flex: 1; }
        .app-title { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
        .app-desc { font-size: 13px; color: var(--text-muted); line-height: 1.4; }
        
        /* 按钮组：支持三个按钮自适应 */
        .btn-group { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }
        .btn { flex: 1 1 30%; text-align: center; padding: 10px 0; border-radius: 10px; font-size: 13px; font-weight: 600; text-decoration: none; color: white; white-space: nowrap; }
        .btn-play { background: var(--btn-play); }
        .btn-web { background: var(--btn-web); }
        .btn-pc { background: var(--btn-pc); }
        
        /* 加载提示 */
        .loading-text { grid-column: 1 / -1; text-align: center; padding: 20px; color: #555; display: none; }
        .no-result { grid-column: 1 / -1; text-align: center; padding: 50px 0; color: #555; font-size: 16px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-top">
            <div>
                <h1>探索应用</h1>
                <p>海量应用，安全直达</p>
            </div>
        </div>
        <input type="text" id="searchInput" class="search-box" placeholder="搜索应用、游戏、工具...">
    </div>

    <div class="categories" id="categories">
        <button class="cat-btn active" data-category="全部">全部</button>
        <button class="cat-btn" data-category="写代码">写代码</button>
        <button class="cat-btn" data-category="玩机">玩机</button>
        <button class="cat-btn" data-category="社交">社交</button>
        <button class="cat-btn" data-category="工具">工具</button>
        <button class="cat-btn" data-category="影音">影音</button>
        <button class="cat-btn" data-category="游戏">游戏</button>
    </div>

    <div class="app-grid" id="appGrid"></div>
    <div class="loading-text" id="loadingText">加载更多应用中...</div>

    <div class="footer">
        本站仅提供官方安全下载链接，不托管任何安装包。<br>
        应用版权归各自开发者所有。
    </div>

    <script>
        // ==========================================
        // 数据池
        // ==========================================
        const appsData = [
                 // ================= 游戏 =================
{ name: "Mobile Legends", desc: "东南亚最火的 MOBA 竞技。", category: "游戏", playUrl: "https://play.google.com/store/apps/details?id=com.mobile.legends", webUrl: "https://m.mobilelegends.com/", iconChar: "M", iconColor: "#1A237E" },
{ name: "PUBG MOBILE", desc: "全球知名的战术竞技类射击游戏。", category: "游戏", playUrl: "https://play.google.com/store/apps/details?id=com.tencent.ig", webUrl: "https://www.pubgmobile.com/", pcUrl: "https://www.pubgmobile.com/en/download.shtml", iconChar: "P", iconColor: "#F4A460" },
{ name: "Blockman GO", desc: "3D像素风格的沙盒多人在线游戏。", category: "游戏", playUrl: "https://play.google.com/store/apps/details?id=com.sandboxol.blockymods", webUrl: "https://www.blockmango.com/", iconChar: "B", iconColor: "#00bcd4" },
{ name: "Free Fire", desc: "节奏极快的生存射击游戏。", category: "游戏", playUrl: "https://play.google.com/store/apps/details?id=com.dts.freefireth", webUrl: "https://ff.garena.com/", iconChar: "F", iconColor: "#FF5722" },
{ name: "我的世界", desc: "风靡全球的 3D 沙盒建造游戏。", category: "游戏", playUrl: "https://play.google.com/store/apps/details?id=com.mojang.minecraftpe", webUrl: "https://www.minecraft.net/", pcUrl: "https://www.minecraft.net/en-us/download", iconChar: "M", iconColor: "#4CAF50" },
{ name: "Roblox", desc: "3D 沙盒游戏平台。", category: "游戏", playUrl: "https://play.google.com/store/apps/details?id=com.roblox.client", webUrl: "https://www.roblox.com/", pcUrl: "https://www.roblox.com/download", iconChar: "R", iconColor: "#e2231a" },
{ name: "原神", desc: "开放世界冒险游戏。", category: "游戏", playUrl: "https://play.google.com/store/apps/details?id=com.miHoYo.GenshinImpact", webUrl: "https://ys.mihoyo.com/", pcUrl: "https://ys.mihoyo.com/download", iconChar: "原", iconColor: "#ffc107" },
{ name: "崩坏：星穹铁道", desc: "银河冒险策略游戏。", category: "游戏", playUrl: "https://play.google.com/store/apps/details?id=com.HoYoverse.hkrpgoversea", webUrl: "https://hsr.hoyoverse.com/", pcUrl: "https://hsr.hoyoverse.com/download", iconChar: "星", iconColor: "#4A148C" },
{ name: "Call of Duty", desc: "使命召唤手游版。", category: "游戏", playUrl: "https://play.google.com/store/apps/details?id=com.activision.callofduty.shooter", webUrl: "https://www.callofduty.com/mobile", iconChar: "C", iconColor: "#000000" },
{ name: "Stumble Guys", desc: "多人派对闯关游戏。", category: "游戏", playUrl: "https://play.google.com/store/apps/details?id=com.kitkagames.fallbuddies", webUrl: "https://stumbleguys.com/", pcUrl: "https://store.steampowered.com/app/1677740/Stumble_Guys/", iconChar: "S", iconColor: "#FFCA28" },
{ name: "部落冲突", desc: "经典策略对战游戏。", category: "游戏", playUrl: "https://play.google.com/store/apps/details?id=com.supercell.clashofclans", webUrl: "https://supercell.com/", iconChar: "C", iconColor: "#8D6E63" },
{ name: "荒野乱斗", desc: "快节奏 3v3 乱斗游戏。", category: "游戏", playUrl: "https://play.google.com/store/apps/details?id=com.supercell.brawlstars", webUrl: "https://supercell.com/", iconChar: "B", iconColor: "#FFC107" } 
      ];

        const appGrid = document.getElementById('appGrid');
        const catBtns = document.querySelectorAll('.cat-btn');
        const searchInput = document.getElementById('searchInput');
        const loadingText = document.getElementById('loadingText');

        let currentCategory = '全部';
        let searchQuery = '';
        let filteredApps = [...appsData];
        let currentPage = 1;
        const itemsPerPage = 24; // 每次加载 24 个
        let isLoading = false;
        let hasMore = true;

        function renderApps(reset = false) {
            if (reset) {
                appGrid.innerHTML = '';
                currentPage = 1;
                hasMore = true;
                filteredApps = appsData.filter(app => {
                    const matchCategory = currentCategory === '全部' || app.category === currentCategory;
                    const matchSearch = app.name.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchCategory && matchSearch;
                });
            }

            if (!hasMore || isLoading) return;

            isLoading = true;
            loadingText.style.display = 'block';

            setTimeout(() => {
                const startIndex = (currentPage - 1) * itemsPerPage;
                const endIndex = startIndex + itemsPerPage;
                const pageItems = filteredApps.slice(startIndex, endIndex);

                if (pageItems.length === 0 && currentPage === 1) {
                    appGrid.innerHTML = '<div class="no-result">没有找到相关应用哦~</div>';
                    loadingText.style.display = 'none';
                    isLoading = false;
                    return;
                }

                pageItems.forEach((app, index) => {
                    const card = document.createElement('div');
                    card.className = 'app-card';
                    card.style.animationDelay = (index * 0.02) + 's'; 
                    
                    let iconHTML = app.iconChar;
                    if(app.iconUrl) {
                        iconHTML = '<img src="' + app.iconUrl + '" style="width: 100%; height: 100%; object-fit: cover;">';
                    }
                    
                    let iconStyle = '';
                    if(!app.iconUrl) {
                        iconStyle = 'background: ' + app.iconColor + '; box-shadow: 0 5px 15px ' + app.iconColor + '40;';
                    }

                    // ===== 动态生成按钮组 =====
                    let btnHTML = '<div class="btn-group">';
                    if (app.playUrl) btnHTML += '<a href="' + app.playUrl + '" class="btn btn-play" target="_blank" rel="noopener">Google Play</a>';
                    if (app.webUrl) btnHTML += '<a href="' + app.webUrl + '" class="btn btn-web" target="_blank" rel="noopener">官网下载</a>';
                    if (app.pcUrl) btnHTML += '<a href="' + app.pcUrl + '" class="btn btn-pc" target="_blank" rel="noopener">PC 下载</a>';
                    btnHTML += '</div>';

                    card.innerHTML = 
                        '<div class="app-header">' +
                            '<div class="app-icon" style="' + iconStyle + '">' + iconHTML + '</div>' +
                            '<div class="app-info">' +
                                '<h2 class="app-title">' + app.name + '</h2>' +
                                '<p class="app-desc">' + app.desc + '</p>' +
                            '</div>' +
                        '</div>' + btnHTML;
                    appGrid.appendChild(card);
                });

                currentPage++;
                if (endIndex >= filteredApps.length) {
                    hasMore = false;
                    loadingText.style.display = 'none';
                } else {
                    loadingText.style.display = 'none';
                }
                isLoading = false;
            }, 300);
        }

        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
                renderApps();
            }
        });

        catBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                catBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.getAttribute('data-category');
                window.scrollTo(0, 0);
                renderApps(true);
            });
        });

        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = e.target.value;
                window.scrollTo(0, 0);
                renderApps(true);
            }, 300);
        });

        renderApps(true);
    </script>
</body>
</html>
